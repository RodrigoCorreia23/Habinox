name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valores fictícios: o CI não fala com serviços reais.
      NEXT_PUBLIC_APP_ENV: development
      CRON_SECRET: ci-cron-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Instalar browser do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes e2e
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
