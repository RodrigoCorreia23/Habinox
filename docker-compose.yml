# Postgres local para desenvolvimento e testes. Porta 5433 para não colidir
# com um Postgres nativo na 5432.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: abinox
      POSTGRES_PASSWORD: abinox
      POSTGRES_DB: abinox
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abinox"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
